<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>try{if(localStorage.getItem('sage-theme')==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}</script>
    <title>CEREBRUM — Your SAGE Brain</title>
    <link rel="icon" type="image/svg+xml" href="/ui/favicon.svg">
    <link rel="stylesheet" href="/ui/css/sage.css?v=774">
    <style>
        /* This shell must remain readable when every application dependency fails. */
        #sage-bootstrap-shell {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #0a0e17;
            color: #e5e7eb;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        }
        #sage-bootstrap-card {
            width: min(520px, 100%);
            padding: 28px;
            border: 1px solid #334155;
            border-radius: 12px;
            background: #111827;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.35);
        }
        #sage-bootstrap-card .eyebrow {
            margin: 0 0 10px;
            color: #22d3ee;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.12em;
        }
        #sage-bootstrap-card h1 {
            margin: 0 0 12px;
            font-size: 22px;
        }
        #sage-bootstrap-card p {
            margin: 0;
            color: #9ca3af;
            line-height: 1.55;
        }
        #sage-bootstrap-diagnostic {
            margin-top: 16px !important;
            color: #fbbf24 !important;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 12px;
        }
        #sage-bootstrap-reload {
            margin-top: 18px;
            padding: 9px 14px;
            border: 1px solid #0891b2;
            border-radius: 8px;
            background: #0891b2;
            color: #fff;
            cursor: pointer;
            font: inherit;
            font-weight: 650;
        }
        #sage-bootstrap-pulse {
            width: 9px;
            height: 9px;
            margin-top: 18px;
            border-radius: 50%;
            background: #10b981;
            animation: sage-bootstrap-pulse 1.2s ease-in-out infinite alternate;
        }
        @keyframes sage-bootstrap-pulse {
            from { opacity: 0.35; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1.1); }
        }
        @media (prefers-reduced-motion: reduce) {
            #sage-bootstrap-pulse { animation: none; }
        }
        :root[data-theme="light"] #sage-bootstrap-shell {
            background: #eef2f7;
            color: #1e293b;
        }
        :root[data-theme="light"] #sage-bootstrap-card {
            border-color: #cbd5e1;
            background: #fff;
            box-shadow: 0 12px 36px rgba(15, 23, 42, 0.12);
        }
        :root[data-theme="light"] #sage-bootstrap-card p { color: #475569; }
    </style>
    <script>
    (() => {
        "use strict";

        const diagnosticCodes = Object.freeze({
            timeout: "ui-bootstrap/timeout",
            "module-load": "ui-bootstrap/module-load",
            "script-load": "ui-bootstrap/script-load",
            runtime: "ui-bootstrap/runtime",
            rejection: "ui-bootstrap/rejection",
            render: "ui-bootstrap/render",
            unknown: "ui-bootstrap/unknown",
        });
        let isReady = false;
        let timeoutID = 0;
        let pendingCode = "";

        function presentFailure() {
            if (isReady || !pendingCode) return;
            const shell = document.getElementById("sage-bootstrap-shell");
            if (!shell) {
                document.addEventListener("DOMContentLoaded", presentFailure, { once: true });
                return;
            }
            const root = document.getElementById("app");
            const title = document.getElementById("sage-bootstrap-title");
            const message = document.getElementById("sage-bootstrap-message");
            const diagnostic = document.getElementById("sage-bootstrap-diagnostic");
            const reload = document.getElementById("sage-bootstrap-reload");
            const pulse = document.getElementById("sage-bootstrap-pulse");
            if (root) {
                root.dataset.sageBootstrapState = "failed";
                root.setAttribute("aria-busy", "false");
            }
            shell.setAttribute("role", "alert");
            if (title) title.textContent = "CEREBRUM could not start";
            if (message) {
                message.textContent = "Your SAGE node is still running and your memories were not changed. Reload once; if this repeats, install the latest SAGE update and include the diagnostic code below.";
            }
            if (diagnostic) {
                diagnostic.textContent = "Diagnostic code: " + pendingCode;
                diagnostic.hidden = false;
            }
            if (pulse) pulse.hidden = true;
            if (reload) {
                reload.hidden = false;
                reload.onclick = () => window.location.reload();
            }
        }

        function fail(code, detail) {
            if (isReady) return;
            pendingCode = diagnosticCodes[code] || diagnosticCodes.unknown;
            if (timeoutID) window.clearTimeout(timeoutID);
            if (detail !== undefined) {
                console.error("CEREBRUM bootstrap failure", detail);
            } else {
                console.error("CEREBRUM bootstrap failure:", pendingCode);
            }
            presentFailure();
        }

        window.__sageBootstrap = Object.freeze({
            ready() {
                isReady = true;
                if (timeoutID) window.clearTimeout(timeoutID);
                const root = document.getElementById("app");
                if (root) {
                    root.dataset.sageBootstrapState = "ready";
                    root.setAttribute("aria-busy", "false");
                }
            },
            fail,
        });

        window.addEventListener("error", (event) => {
            const target = event && event.target;
            if (target && target !== window && target.tagName === "SCRIPT") {
                fail(target.type === "module" ? "module-load" : "script-load");
                return;
            }
            fail("runtime", event && (event.error || event.message));
        }, true);
        window.addEventListener("unhandledrejection", (event) => {
            fail("rejection", event && event.reason);
        });
        timeoutID = window.setTimeout(() => fail("timeout"), 10000);
    })();
    </script>
    <!-- Core runtime + QR + 3D brain graph: all vendored locally (no CDN) so the
         packaged app loads, the join wizards render/scan QR, and the MRI brain
         renders fully offline. three.js + 3d-force-graph are pre-bundled into one
         self-contained module (web/static/js/vendor/sage-graph.bundle.js), imported
         directly by mri-brain.js - so no importmap / esm.sh fetch is needed. -->
    <script src="/ui/js/vendor/preact.umd.js"></script>
    <script src="/ui/js/vendor/preact.hooks.umd.js"></script>
    <script src="/ui/js/vendor/htm.umd.js"></script>
    <script src="/ui/js/vendor/qrcode.min.js"></script>
    <script src="/ui/js/vendor/jsQR.min.js"></script>
    <script>window.html = htm.bind(preact.h);</script>
</head>
<body>
    <div id="app" data-sage-bootstrap-state="pending" aria-busy="true">
        <main id="sage-bootstrap-shell" role="status" aria-live="polite">
            <section id="sage-bootstrap-card" aria-labelledby="sage-bootstrap-title">
                <p class="eyebrow">CEREBRUM</p>
                <h1 id="sage-bootstrap-title">Opening your SAGE brain</h1>
                <p id="sage-bootstrap-message">Loading local controls…</p>
                <p id="sage-bootstrap-diagnostic" hidden></p>
                <button id="sage-bootstrap-reload" type="button" hidden>Reload CEREBRUM</button>
                <div id="sage-bootstrap-pulse" aria-hidden="true"></div>
                <noscript><p>JavaScript is required to open CEREBRUM.</p></noscript>
            </section>
        </main>
    </div>
    <script type="module" src="/ui/js/app.js?v=774"></script>
</body>
</html>
